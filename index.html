<!-- 首帧就把深浅色定下来：否则深色模式下会先闪一下白底，地址栏颜色也对不上（v38 · 外部评审 P0-6）。
     v52 · 报告 P0-3：这段跑在所有 defer 脚本之前，此时 IndexedDB 还没打开，
     所以只能读 localStorage。而 state 早已迁到 IDB 并从 localStorage 删掉了 ——
     以前读 'rigongyizhu.state' 等于永远读不到，手选主题的人每次冷启动都会闪一下。
     现在按 rgz.theme（主）→ rigongyizhu.state（老用户兜底）→ system 的顺序读，
     applyTheme() 每次都会把 rgz.theme 写回去。 -->
<script>
(function(){try{
var t=localStorage.getItem('rgz.theme');
if(!t){var s=JSON.parse(localStorage.getItem('rigongyizhu.state')||'{}')||{};t=(s.settings&&s.settings.theme)||'system';}
var qp=new URLSearchParams(location.search).get('theme');if(qp)t=qp;
if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
if(t!=='dark')t='light';
document.documentElement.setAttribute('data-theme',t);
/* v58：主题色首帧镜像（applyAccent 每次都写回 rgz.accent，值不是 key，这里不用带表） */
try{var a=JSON.parse(localStorage.getItem('rgz.accent')||'null');
if(a&&a.l&&a.d){var rs=document.documentElement.style;
rs.setProperty('--accent',t==='dark'?a.d[0]:a.l[0]);
rs.setProperty('--accent-soft',t==='dark'?a.d[1]:a.l[1]);}}catch(e){}
var m=document.querySelector('meta[name="theme-color"]');
if(m)m.setAttribute('content',t==='dark'?'#12141c':'#f6f7fb');
}catch(e){}})();
</script>

<script>
/* 首屏"抢跑"：这段是普通脚本，会在下面所有 defer 脚本之前执行，
   先把日期填上，让顶栏第一帧就是完整的样子，而不是一排"—"。 */
(function () {
  try {
    var d = new Date(), W = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    var el = document.getElementById('tDate');
    if (el) el.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + W[d.getDay()];
    var sub = document.getElementById('tSub');
    if (sub) sub.textContent = '正在载入…';
  } catch (e) { }
  /* 兜底：万一主脚本出错，也要把骨架撤掉，别让人对着灰条干等 */
  setTimeout(function () {
    var s = document.getElementById('skel');
    if (s && s.parentNode) s.parentNode.removeChild(s);
  }, 2600);
})();
</script>
